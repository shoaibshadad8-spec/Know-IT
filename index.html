<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <nav class="navbar bg-body-tertiary px-3">
        <a class="navbar-brand fw-bold text-primary" href="#">KNOW IT</a>
    </nav>

    <div class="container my-4">
        <div class="row">
            
            <main class="col-md-8">
                <h2 class="text-primary mb-3">Sports News</h2>
                <div class="row" id="sports-news">
                    <div class="col-md-4 mb-3">
                        <h5>Loading news...</h5>
                    </div>
                </div>
            </main>

            <aside class="col-md-4">
                
                <div class="text-center p-3 border rounded bg-white mb-3 shadow-sm">
                    <h2 class="display-6" id="temperature">--°C</h2>
                    <h3 class="text-muted fs-5" id="city-name">Asyut</h3>
                </div>

                <div class="p-3 border rounded bg-white mb-3 shadow-sm">
                    <h4 class="text-primary mb-2">Currency Rates</h4>
                    <p>USD: 51.59 | EUR: 58.40</p>
                </div>

                <div class="p-3 border rounded bg-white mb-3 shadow-sm">
                    <h4 class="text-primary mb-2">Live Matches</h4>
                    <p class="fw-bold">Team 1 <span class="text-danger">0 : 0</span> Team 2</p>
                </div>

            </aside>
        </div>
    </div>

    <footer class="bg-info py-2 text-center text-white">
        <p class="mb-0">All Rights reserved to Know IT 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
